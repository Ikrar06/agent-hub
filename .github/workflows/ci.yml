name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: node --test

    - name: Run end-to-end mock tests
      run: node scripts/e2e-mock.js

    - name: Verify documentation
      run: |
        echo "Checking that required documentation files exist..."
        ls -la docs/BRIEF.md docs/PLAN.md docs/TASKS.md

    - name: Verify agent command availability
      run: |
        echo "Checking that agent command is available..."
        node bin/agent.js --help