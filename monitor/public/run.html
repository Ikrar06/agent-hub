<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Hub Monitor - Run Detail</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0066cc; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .section { margin-bottom: 30px; }
        .section h2 { color: #555; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .content { background: #f9f9f9; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-break: break-all; }
        .timestamp { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Back to Runs List</a>
    <h1>Run Detail</h1>
    <div class="section">
        <h2>Run Information</h2>
        <div class="content" id="runInfo">Loading...</div>
    </div>
    <div class="section">
        <h2>Events</h2>
        <div class="content" id="runEvents">Loading...</div>
    </div>
    <div class="section">
        <h2>Logs</h2>
        <div class="content" id="runLogs">Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const runId = urlParams.get('id');
        if (!runId) {
            document.getElementById('runInfo').textContent = 'No run ID specified';
            return;
        }

        async function loadRunDetail() {
            try {
                const response = await fetch(`/api/runs/${runId}`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch run: ${response.status}`);
                }
                const run = await response.json();

                // Display basic info
                const infoDiv = document.getElementById('runInfo');
                infoDiv.innerHTML = ''; // Clear existing content

                const createParagraphWithLabel = (label, value, isHtml = false) => {
                    const p = document.createElement('p');
                    const strong = document.createElement('strong');
                    strong.textContent = label;
                    p.appendChild(strong);
                    p.appendChild(document.createTextNode(' '));

                    if (isHtml && typeof value === 'string' && value.includes('<a href=')) {
                        // Handle the special case for PR URL
                        const span = document.createElement('span');
                        span.innerHTML = value; // This is safe as we control the value
                        p.appendChild(span);
                    } else {
                        if (value instanceof DocumentFragment) {
                            p.appendChild(value);
                        } else {
                            p.appendChild(document.createTextNode(value));
                        }
                    }
                    return p;
                };

                // Add each piece of info
                infoDiv.appendChild(createParagraphWithLabel('Run ID:', run.id || '-'));
                infoDiv.appendChild(createParagraphWithLabel('Repository:', run.repo || '-'));
                infoDiv.appendChild(createParagraphWithLabel('Branch:', run.branch || '-'));
                infoDiv.appendChild(createParagraphWithLabel('Base SHA:', run.base_sha || '-'));

                const startTimePara = document.createElement('p');
                const startTimeStrong = document.createElement('strong');
                startTimeStrong.textContent = 'Start Time:';
                startTimePara.appendChild(startTimeStrong);
                startTimePara.appendChild(document.createTextNode(' '));
                const startTimeSpan = document.createElement('span');
                startTimeSpan.className = 'timestamp';
                startTimeSpan.textContent = run.started_at ? new Date(run.started_at).toLocaleString() : '-';
                startTimePara.appendChild(startTimeSpan);
                infoDiv.appendChild(startTimePara);

                const lastHeartbeatPara = document.createElement('p');
                const lastHeartbeatStrong = document.createElement('strong');
                lastHeartbeatStrong.textContent = 'Last Heartbeat:';
                lastHeartbeatPara.appendChild(lastHeartbeatStrong);
                lastHeartbeatPara.appendChild(document.createTextNode(' '));
                const lastHeartbeatSpan = document.createElement('span');
                lastHeartbeatSpan.className = 'timestamp';
                lastHeartbeatSpan.textContent = run.last_heartbeat ? new Date(run.last_heartbeat).toLocaleString() : '-';
                lastHeartbeatPara.appendChild(lastHeartbeatSpan);
                infoDiv.appendChild(lastHeartbeatPara);

                infoDiv.appendChild(createParagraphWithLabel('Current Stage:', run.stage || '-'));
                infoDiv.appendChild(createParagraphWithLabel('Current Agent:', run.agent || '-'));
                infoDiv.appendChild(createParagraphWithLabel('Current Model:', run.model || '-'));

                const taskIndexPara = document.createElement('p');
                const taskIndexStrong = document.createElement('strong');
                taskIndexStrong.textContent = 'Task Index:';
                taskIndexPara.appendChild(taskIndexStrong);
                taskIndexPara.appendChild(document.createTextNode(' '));
                const taskIndexText = document.createTextNode(
                    `${run.task_index !== undefined ? run.task_index + 1 : '-'}/${run.task_total || '-'}`);
                taskIndexPara.appendChild(taskIndexText);
                infoDiv.appendChild(taskIndexPara);

                infoDiv.appendChild(createParagraphWithLabel('Fix Round:', run.fix_round || 0));
                infoDiv.appendChild(createParagraphWithLabel('Review Round:', run.review_round || 0));

                const statePara = document.createElement('p');
                const stateStrong = document.createElement('strong');
                stateStrong.textContent = 'State:';
                statePara.appendChild(stateStrong);
                statePara.appendChild(document.createTextNode(' '));
                const stateSpan = document.createElement('span');
                stateSpan.className = `status-${run.state || 'unknown'}`;
                stateSpan.textContent = run.state || '-';
                statePara.appendChild(stateSpan);
                infoDiv.appendChild(statePara);

                infoDiv.appendChild(createParagraphWithLabel('Message:', run.message || '-'));

                const prUrlPara = document.createElement('p');
                const prUrlStrong = document.createElement('strong');
                prUrlStrong.textContent = 'PR URL:';
                prUrlPara.appendChild(prUrlStrong);
                prUrlPara.appendChild(document.createTextNode(' '));
                if (run.pr_url) {
                    const prLink = document.createElement('a');
                    prLink.href = run.pr_url;
                    prLink.target = '_blank';
                    prLink.textContent = 'View PR';
                    prUrlPara.appendChild(prLink);
                } else {
                    prUrlPara.appendChild(document.createTextNode('-'));
                }
                infoDiv.appendChild(prUrlPara);

                // Try to load events.jsonl
                try {
                    const eventsResponse = await fetch(`/api/runs/${runId}/events.jsonl`);
                    if (eventsResponse.ok) {
                        const eventsText = await eventsResponse.text();
                        document.getElementById('runEvents').textContent = eventsText || 'No events available';
                    } else {
                        document.getElementById('runEvents').textContent = 'Events not available';
                    }
                } catch (e) {
                    document.getElementById('runEvents').textContent = 'Error loading events';
                }

                // Try to load agent.log
                try {
                    const logResponse = await fetch(`/api/runs/${runId}/agent.log`);
                    if (logResponse.ok) {
                        const logText = await logResponse.text();
                        document.getElementById('runLogs').textContent = logText || 'No log available';
                    } else {
                        document.getElementById('runLogs').textContent = 'Log not available';
                    }
                } catch (e) {
                    document.getElementById('runLogs').textContent = 'Error loading log';
                }
            } catch (error) {
                document.getElementById('runInfo').textContent = `Error loading run detail: ${error.message}`;
            }
        }

        loadRunDetail();
    </script>
</body>
</html>
